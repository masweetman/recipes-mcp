[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recipes-mcp"
version = "0.1.0"
description = "Self-hosted MCP server that searches food blogs and extracts recipes"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27",
    "recipe-scrapers>=15",
    "pyyaml>=6",
    "pydantic-settings>=2.3",
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["src/recipes_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
